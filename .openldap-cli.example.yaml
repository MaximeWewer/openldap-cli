# Copy to ~/.openldap-cli.yaml and edit. Any field can be overridden by env
# vars (LDAP_URL, LDAP_BASE_DN, LDAP_BIND_DN, LDAP_BIND_PW, LDAP_USER_OU,
# LDAP_GROUP_OU, LDAP_MAIL_DOMAIN, LDAP_START_TLS, LDAP_INSECURE, LDAP_TIMEOUT).
#
# chmod 600 this file once it holds a password - the CLI warns if it does not.
# LDAP_BIND_PW_FILE / LDAP_CONFIG_BIND_PW_FILE read the password from a file
# instead, which is what a Docker or Kubernetes secret mounts.

default: test

profiles:
  # matches tests/ (make test-up). Plaintext ldap://389, cleartext admin.
  test:
    url: ldap://localhost:389
    base_dn: dc=example,dc=org
    bind_dn: cn=admin,ou=users,dc=example,dc=org
    bind_pw: adminpassword
    user_ou: ou=users
    group_ou: ou=groups
    policy_ou: ou=policies
    mail_domain: example.org
    # second bind for cn=config writes (svc ACL injection). Test-only known pw.
    config_bind_dn: cn=adminconfig,cn=config
    config_bind_pw: configpassword

  # same test server, bound as the rootDN (bypasses ACLs). Needed for writes to
  # ou=policies (ppolicy set) and arbitrary OUs under the base. Test-only known pw.
  test-root:
    url: ldap://localhost:389
    base_dn: dc=example,dc=org
    bind_dn: cn=admin,dc=example,dc=org
    bind_pw: rootpassword
    user_ou: ou=users
    group_ou: ou=groups
    policy_ou: ou=policies
    mail_domain: example.org

  dev:
    url: ldaps://localhost:636
    base_dn: dc=example,dc=org
    bind_dn: cn=admin,dc=example,dc=org
    bind_pw: ""            # better: export LDAP_BIND_PW=...
    user_ou: ou=people
    group_ou: ou=groups
    mail_domain: example.org
    insecure: true          # dev only: skip TLS cert verify

  prod:
    url: ldaps://ldap.example.org:636
    base_dn: dc=example,dc=org
    bind_dn: cn=admin,dc=example,dc=org
    # no bind_pw here: export LDAP_BIND_PW_FILE=/run/secrets/ldap-bind-pw
    # private CA? point at a PEM bundle instead of insecure: true.
    # `openldap-cli tls export ca.pem` writes it.
    ca_file: /etc/ssl/certs/ldap-ca.pem
    user_ou: ou=people
    group_ou: ou=groups
    mail_domain: example.org
    timeout: 2m             # cap on the dial and on each operation (default 2m)

  # Passwordless local admin: SASL EXTERNAL over the ldapi:// Unix socket. Run as
  # root on the LDAP host; the identity comes from peer creds, so no bind_dn /
  # bind_pw / config_bind_dn. (Server must map the peer identity to a priv DN.)
  local-root:
    url: ldapi:///              # default socket /var/run/slapd/ldapi
    base_dn: dc=example,dc=org
    sasl_external: true
